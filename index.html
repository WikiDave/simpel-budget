<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <title>Budget Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HOME: alle omgevingen ===== -->
  <main id="view-home" class="view">
    <header class="home-header">
      <h1 class="brand">budget<span>planner</span></h1>
    </header>

    <div id="env-list" class="env-list"></div>

    <div id="home-empty" class="empty hidden">
      <div class="empty-emoji">🪴</div>
      <h2>Nog geen omgevingen</h2>
      <p>Maak je eerste budget-omgeving aan met de knop hieronder.</p>
    </div>

    <div class="fab-wrap">
      <button class="fab" onclick="openEnvForm()" aria-label="Nieuwe omgeving">+</button>
      <span class="fab-label">Nieuwe omgeving</span>
    </div>
  </main>

  <!-- ===== OMGEVING ===== -->
  <main id="view-env" class="view hidden">
    <div class="topbar">
      <button class="round-btn" onclick="goHome()" aria-label="Terug">‹</button>
      <button class="round-btn" onclick="openEnvMenu()" aria-label="Opties">⋯</button>
    </div>

    <div class="env-hero">
      <div class="env-hero-emoji" id="env-emoji"></div>
      <h1 id="env-name"></h1>
    </div>

    <div class="month-switch">
      <button class="month-arrow" onclick="shiftMonth(-1)" aria-label="Vorige maand">‹</button>
      <button class="month-label" id="month-label" onclick="goToday()" title="Naar deze maand"></button>
      <button class="month-arrow" onclick="shiftMonth(1)" aria-label="Volgende maand">›</button>
    </div>

    <section class="summary" id="summary"></section>

    <div class="segmented">
      <button class="seg active" data-tab="costs" onclick="setTab('costs')">Kosten</button>
      <button class="seg" data-tab="income" onclick="setTab('income')">Inkomsten</button>
    </div>

    <div id="item-list" class="item-list"></div>

    <div class="fab-wrap">
      <button class="fab" onclick="openItemForm()" aria-label="Toevoegen">+</button>
      <span class="fab-label" id="fab-item-label">Voeg kost toe</span>
    </div>
  </main>

  <!-- ===== BOTTOM SHEET ===== -->
  <div class="sheet-backdrop hidden" id="sheet-backdrop" onclick="closeSheet()"></div>
  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
